name: Agent V2 global remote projection

on:
  pull_request:
    paths:
      - 'coordination/BOOT.md'
      - 'coordination/v2/**'
      - 'scripts/coord-v2-*.mjs'
      - 'scripts/lib/coord-v2-model.mjs'
      - 'tests/coord-v2-*.test.mjs'
      - '.github/workflows/coord-v2-*.yml'
  push:
    branches:
      - coordination/gonza-v2-isolated

jobs:
  global-remote:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full V2 implementation history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct global current state from every declared claim ref
        run: |
          node scripts/coord-v2-project.mjs --remote origin --strict-git > /tmp/coord-v2-current.json
          cat /tmp/coord-v2-current.json
          node - <<'NODE'
          const fs=require('fs');
          const current=JSON.parse(fs.readFileSync('/tmp/coord-v2-current.json','utf8'));
          if(!Array.isArray(current?.v2?.tasks)||!Array.isArray(current?.v2?.slots)||!Array.isArray(current?.v2?.instances)) {
            throw new Error('malformed global V2 projection');
          }
          const unique=(rows,label)=>{
            const ids=rows.map(x=>x.id);
            if(new Set(ids).size!==ids.length) throw new Error(`duplicate ${label} ids in global projection`);
          };
          unique(current.v2.tasks,'task');
          unique(current.v2.slots,'slot');
          unique(current.v2.instances,'instance');
          console.log(`GLOBAL_REMOTE_PROJECTION_PASS tasks=${current.v2.tasks.length} slots=${current.v2.slots.length} active=${current.v2.instances.filter(x=>x.state==='ACTIVE').length}`);
          NODE

      - name: Strict global invariant validator
        run: node scripts/coord-v2-validate.mjs --remote origin --strict-git
