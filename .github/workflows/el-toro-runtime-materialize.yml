name: Materialize El Toro runtime assets

on:
  push:
    branches:
      - round/r005-sprite-mario-a-live-repair

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install TypeScript compiler
        run: npm install --global typescript@latest

      - name: Generate verified bilateral runtime package
        run: |
          rm -rf /tmp/el-toro-runtime assets/fighters/el-toro
          mkdir -p assets/fighters/el-toro
          node scripts/el-toro-sprite-atlas-packer.mjs \
            --source-dir docs/characters/el-toro/sprite-source/right \
            --left-source-dir docs/characters/el-toro/sprite-source/left \
            --package-contract docs/characters/el-toro/sprite-package/right-package.json \
            --right-verified-anchor-review docs/characters/el-toro/sprite-package/anchors/right-verified.json \
            --left-verified-anchor-review docs/characters/el-toro/sprite-package/anchors/left-verified.json \
            --out-dir /tmp/el-toro-runtime
          cp /tmp/el-toro-runtime/el-toro-animations.json assets/fighters/el-toro/
          cp /tmp/el-toro-runtime/el-toro-body.png assets/fighters/el-toro/
          sha256sum assets/fighters/el-toro/el-toro-animations.json assets/fighters/el-toro/el-toro-body.png

      - name: Full test suite
        run: npm test

      - name: Build and served asset gate
        run: |
          npm run build
          test -f dist/assets/fighters/el-toro/el-toro-animations.json
          test -f dist/assets/fighters/el-toro/el-toro-body.png

      - name: Commit deterministic runtime assets and retire helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/el-toro-runtime-materialize.yml
          git add assets/fighters/el-toro/el-toro-animations.json assets/fighters/el-toro/el-toro-body.png
          git commit -m "sprite: materialize verified El Toro runtime assets"
          git push origin HEAD:round/r005-sprite-mario-a-live-repair
