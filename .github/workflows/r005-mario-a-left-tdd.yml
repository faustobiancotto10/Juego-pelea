name: R005 Mario-A LEFT TDD
on:
  push:
    branches:
      - round/r005-sprite-mario-a-source-import
permissions:
  contents: read
jobs:
  left-source-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test tests/el-toro-left-sprite-source-pipeline.test.mjs
