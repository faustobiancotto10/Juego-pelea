name: Repository verification

on:
  pull_request:
  push:
    branches:
      - main
      - feat/multi-agent-coordination

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install TypeScript compiler
        run: npm install --global typescript@latest

      - name: Coordination contract
        run: node --test tests/coordination-contract.test.mjs

      - name: Full test suite
        run: npm test

      - name: Build
        run: npm run build

      - name: Create V07-M2 phone visual harness
        run: |
          mkdir -p dist/qa artifacts
          cat > dist/qa/v07-m2.html <<'EOF'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width,initial-scale=1">
            <style>
              *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080b10;color:#fff;font-family:system-ui,sans-serif}
              body{padding:8px}.grid{display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:142px 218px;gap:7px;height:374px}
              .card{position:relative;border:1px solid #3d4654;border-radius:12px;overflow:hidden;background:#10151e}
              .card b{position:absolute;left:8px;top:6px;z-index:2;font-size:10px;letter-spacing:.08em;background:#090d13cc;padding:3px 6px;border-radius:5px}
              canvas{width:100%;height:100%;display:block}.move{grid-column:span 1}.wide{grid-column:span 1}
            </style>
          </head>
          <body>
            <div class="grid">
              <div class="card"><b>CAMALEONI</b><canvas id="p0" width="200" height="142"></canvas></div>
              <div class="card"><b>SUPERNARIZ</b><canvas id="p1" width="200" height="142"></canvas></div>
              <div class="card"><b>JUANCHI</b><canvas id="p2" width="200" height="142"></canvas></div>
              <div class="card"><b>EL TORO</b><canvas id="p3" width="200" height="142"></canvas></div>
              <div class="card move"><b>TOPETE</b><canvas id="m0" width="200" height="218"></canvas></div>
              <div class="card move"><b>SHAWARMAZO</b><canvas id="m1" width="200" height="218"></canvas></div>
              <div class="card move"><b>SUPER ERUCTO</b><canvas id="m2" width="200" height="218"></canvas></div>
              <div class="card move"><b>HEAVY RIG</b><canvas id="m3" width="200" height="218"></canvas></div>
            </div>
            <script type="module">
              import { drawFighterPortrait } from '../game/render/PortraitRenderer.js';
              import { drawElToro } from '../game/render/ElToroRig.js';
              import { drawTopeteDrive, drawToroGroundImpact, drawShawarmaProjectile, drawShawarmaImpact, drawSuperEructoBlast } from '../game/render/CombatEffects.js';

              const keys=['chameleon','supernariz','juanchi','el-toro'];
              keys.forEach((key,i)=>drawFighterPortrait(document.querySelector('#p'+i).getContext('2d'),key,200,142));

              const locomotion={
                phase:.25,frontFoot:{x:18,y:0},backFoot:{x:-18,y:2},pelvisDrop:1,torsoLean:.045,
                preparation:0,extension:0,tuck:0,descentBrace:0,landingAbsorption:0,movementBlend:1,
                dashCompression:0,dashDrive:0,clashBrace:0,clashRecoil:0,travelIntent:'forward',actualTravel:4,
                hipCounterRotation:.018,chestCounterRotation:-.026,freeArmSwing:-6,weightTransfer:2
              };
              const base={
                id:'el-toro',x:100,y:0,vx:0,vy:0,facing:1,health:1100,maxHealth:1100,guard:100,maxGuard:100,
                guardRegenDelay:0,guardBreakFrames:0,grounded:true,jumpStartupFrames:0,airborneTicks:0,crouching:false,
                blocking:false,stunFrames:0,blockstunFrames:0,moveId:null,moveFrame:0,comboCount:0,moveContact:'none',
                chilledFrames:0,projectileCooldown:0,projectileCooldownMax:96,rangedAvailability:'ready',rangedRecoveryFrames:0,
                dashKind:null,dashFrame:0,landingRecoveryFrames:0,pushGuardRecoveryFrames:0,superMeter:100,maxSuper:100,
                superReady:true,ultimatePhase:'idle',ultimatePhaseFrame:0,ultimateConnected:false,ultimateTarget:null,
                ultimateEffectiveTick:null,ultimateProbe:null,captureAnchorX:null,clashRecoveryFrames:0,capturedBy:null,roundWins:0
              };
              function prep(id){const c=document.querySelector(id),ctx=c.getContext('2d');ctx.fillStyle='#111721';ctx.fillRect(0,0,c.width,c.height);return ctx}

              let ctx=prep('#m0');
              drawTopeteDrive(ctx,86,206,1,1); drawToroGroundImpact(ctx,130,206,1,.95);
              drawElToro(ctx,{...base,x:84,moveId:'topete',moveFrame:13},{...locomotion,torsoLean:.18},0.7);

              ctx=prep('#m1');
              drawElToro(ctx,{...base,x:70,moveId:'shawarmazoThrow',moveFrame:11},locomotion,0.7);
              drawShawarmaProjectile(ctx,135,115,7.6,14); drawShawarmaImpact(ctx,168,115,1,.82);

              ctx=prep('#m2');
              drawElToro(ctx,{...base,x:55,moveId:'superEructo',ultimatePhase:'sequence',ultimatePhaseFrame:8},locomotion,0.7);
              drawSuperEructoBlast(ctx,78,206,1,.72,115);

              ctx=prep('#m3');
              drawElToro(ctx,{...base,x:100},locomotion,1.2);
              document.body.dataset.ready='true';
            </script>
          </body>
          </html>
          EOF
          python3 -m http.server 4173 -d dist >/tmp/m2-http.log 2>&1 &
          for i in {1..20}; do curl -fsS http://127.0.0.1:4173/qa/v07-m2.html >/dev/null && break; sleep 0.25; done
          BROWSER="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$BROWSER" ]; then echo "No Chromium browser found on runner"; exit 1; fi
          "$BROWSER" --headless=new --disable-gpu --no-sandbox --hide-scrollbars --force-device-scale-factor=1 --window-size=844,390 --virtual-time-budget=1800 --screenshot="$GITHUB_WORKSPACE/artifacts/v07-m2-phone-844x390.png" http://127.0.0.1:4173/qa/v07-m2.html
          test -s artifacts/v07-m2-phone-844x390.png

      - name: Upload V07-M2 phone visual
        uses: actions/upload-artifact@v4
        with:
          name: v07-m2-phone-visual
          path: artifacts/v07-m2-phone-844x390.png
          if-no-files-found: error
