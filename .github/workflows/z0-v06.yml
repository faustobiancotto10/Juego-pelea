name: Z0 V0.6 final integration verification

on:
  pull_request:

permissions:
  contents: write

jobs:
  z0:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact integration head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install tools
        run: |
          npm install --global typescript@latest esbuild@latest
          npm install --no-save playwright@latest
          npx playwright install --with-deps chromium

      - name: Full tests typecheck build
        run: |
          npm test
          npm run typecheck
          npm run build

      - name: Build reproducible standalone
        run: |
          esbuild dist/main.js --bundle --format=iife --platform=browser --target=es2020 --outfile=standalone.js
          node <<'NODE'
          const fs = require('fs');
          let html = fs.readFileSync('index.html','utf8');
          const css = fs.readFileSync('src/styles.css','utf8');
          const js = fs.readFileSync('standalone.js','utf8');
          html = html
            .replace('<title>First Playable Fight</title>','<title>Juego Pelea V0.6</title>')
            .replace('<link rel="stylesheet" href="./styles.css" />','<style>\n'+css+'\n</style>')
            .replace('<script type="module" src="./main.js"></script>','<script>\n'+js+'\n</script>');
          if (html.includes('src="./main.js"') || html.includes('href="./styles.css"')) throw new Error('external runtime refs remain');
          fs.writeFileSync('play.generated.html', html);
          fs.writeFileSync('play.generated.2.html', html);
          NODE
          cmp play.generated.html play.generated.2.html
          SOURCE_FP=$(find src package.json scripts tests -type f -print0 | sort -z | xargs -0 sha256sum | sha256sum | cut -d' ' -f1)
          ARTIFACT_FP=$(sha256sum play.generated.html | cut -d' ' -f1)
          echo "SOURCE_FINGERPRINT=$SOURCE_FP"
          echo "ARTIFACT_SHA256=$ARTIFACT_FP"

      - name: Create source smoke harness
        run: |
          cat > smoke-harness.html <<'HTML'
          <!doctype html>
          <html><body><div id="app"></div>
          <script type="module">
            import { AppController } from './dist/game/ui/AppController.js';
            const root = document.querySelector('#app');
            const controller = new AppController(root);
            window.__controller = controller;
            controller.start();
          </script></body></html>
          HTML

      - name: Integrated V0.6 browser smoke
        run: |
          python3 -m http.server 4173 >/tmp/z0-http.log 2>&1 &
          SERVER_PID=$!
          trap "kill $SERVER_PID" EXIT
          node <<'NODE'
          const { chromium } = require('playwright');

          async function chooseFight(page, stageId) {
            await page.goto('http://127.0.0.1:4173/smoke-harness.html');
            const errors=[];
            page.on('pageerror',e=>errors.push('pageerror:'+e.message));
            page.on('console',m=>{ if(m.type()==='error') errors.push('console:'+m.text()); });

            await page.waitForSelector('[data-game-phase="title"]');
            const startText=(await page.locator('[data-start]').textContent())?.trim();
            if(startText!=='COMENZAR') throw new Error('cover COMENZAR missing');
            await page.locator('[data-start]').click();

            await page.waitForSelector('[data-game-phase="select-player"]');
            if(await page.locator('[data-fighter]').count() < 3) throw new Error('released roster smaller than 3');
            await page.locator('[data-fighter="juanchi"]').click();
            await page.locator('[data-fighter-confirm]').click();

            await page.waitForSelector('[data-game-phase="select-cpu"]');
            await page.locator('[data-fighter="chameleon"]').click();
            await page.locator('[data-fighter-confirm]').click();

            await page.waitForSelector('[data-game-phase="select-stage"]');
            await page.locator(`[data-stage="${stageId}"]`).click();
            await page.locator('[data-stage-confirm]').click();

            await page.waitForSelector('[data-game-phase="vs"]');
            await page.waitForSelector('[data-game-phase="fight"]',{timeout:5000});
            const shell=page.locator('.fight-shell');
            if(await shell.getAttribute('data-stage')!==stageId) throw new Error('selected stage not frozen into fight shell');
            if(await page.locator('canvas').count()!==1) throw new Error('fight canvas missing');
            if(await page.locator('[data-action]').count()!==4) throw new Error('four-action surface regression');

            await page.waitForTimeout(500);
            const canvasSig=await page.locator('canvas').evaluate(c=>c.toDataURL());
            if(errors.length) throw new Error(errors.join(' | '));
            return canvasSig;
          }

          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:852,height:393}});

            const cancha=await chooseFight(page,'cancha-56');
            const tramontana=await chooseFight(page,'tramontana-dusk');
            if(cancha===tramontana) throw new Error('stage selection does not change rendered canvas');

            await chooseFight(page,'cancha-56');
            await page.evaluate(()=>window.__controller['showResult'](0));
            await page.waitForSelector('[data-game-phase="result"]');
            if(!/Cancha 56/i.test(await page.locator('.result-kicker').textContent())) throw new Error('result lost stage identity');
            await page.locator('[data-rematch]').click();
            await page.waitForSelector('[data-game-phase="vs"]');
            await page.waitForSelector('[data-game-phase="fight"]',{timeout:5000});
            if(await page.locator('.fight-shell').getAttribute('data-stage')!=='cancha-56') throw new Error('rematch lost stage');

            await page.locator('[data-controls-button]').click();
            await page.waitForSelector('[data-controls-panel].is-open');
            await page.locator('[data-controls-close]').click();

            console.log('V0.6 title/select/stage/VS/fight/result/rematch smoke PASS');
            console.log('Juanchi selection PASS; Cancha56 vs Tramontana render divergence PASS');
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE

      - name: Upload standalone evidence
        uses: actions/upload-artifact@v4
        with:
          name: v06-z0-standalone
          path: play.generated.html

      - name: Synchronize play.html on integration branch
        run: |
          cp play.generated.html play.html
          if git diff --quiet -- play.html; then
            echo "play.html already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add play.html
          git commit -m "release: sync V0.6 standalone play.html"
          git push origin HEAD:${{ github.head_ref }}
