name: Z0 V0.7 standalone sync

on:
  push:
    branches:
      - round/r005-integration

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: round/r005-integration
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install build tools
        run: npm install --global typescript@latest esbuild@latest
      - name: Build exact standalone
        run: |
          npm run build
          esbuild dist/main.js --bundle --format=iife --platform=browser --target=es2020 --outfile=standalone.js
          node <<'NODE'
          const fs=require('fs');
          let html=fs.readFileSync('index.html','utf8');
          const css=fs.readFileSync('src/styles.css','utf8');
          const js=fs.readFileSync('standalone.js','utf8');
          html=html
            .replace(/<title>[^<]*<\/title>/,'<title>Juego Pelea V0.7</title>')
            .replace('<link rel="stylesheet" href="./styles.css" />','<style>\n'+css+'\n</style>')
            .replace('<script type="module" src="./main.js"></script>','<script>\n'+js+'\n</script>');
          if(html.includes('src="./main.js"')||html.includes('href="./styles.css"')) throw new Error('external runtime refs remain');
          fs.writeFileSync('play.html',html);
          NODE
          HASH=$(sha256sum play.html | cut -d' ' -f1)
          echo "PLAY_SHA256=$HASH"
          test "$HASH" = "b64b18ed408c67eec48f5b60b78e4ed5520c07eabd4ce7ff7a4822cc3524da28"
      - name: Commit exact standalone
        run: |
          if git diff --quiet -- play.html; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add play.html
          git commit -m "release: sync V0.7 standalone play.html"
          git push origin HEAD:round/r005-integration
