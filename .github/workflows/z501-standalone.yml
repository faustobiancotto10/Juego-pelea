name: Z501 standalone artifact

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  standalone:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout head branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install build tools
        run: npm install --global typescript@latest esbuild@latest

      - name: Compile
        run: npm run build

      - name: Bundle browser code
        run: esbuild dist/main.js --bundle --format=iife --platform=browser --target=es2020 --outfile=standalone.js

      - name: Build standalone play.html
        run: |
          node <<'NODE'
          const fs = require('fs');
          let html = fs.readFileSync('index.html', 'utf8');
          const css = fs.readFileSync('src/styles.css', 'utf8');
          const js = fs.readFileSync('standalone.js', 'utf8');
          html = html
            .replace('<title>First Playable Fight</title>', '<title>Juego Pelea V0.3</title>')
            .replace('<link rel="stylesheet" href="./styles.css" />', '<style>\n' + css + '\n</style>')
            .replace('<script type="module" src="./main.js"></script>', '<script>\n' + js + '\n</script>');
          if (html.includes('src="./main.js"') || html.includes('href="./styles.css"')) {
            throw new Error('Standalone generation left external runtime references');
          }
          fs.writeFileSync('play.html', html);
          NODE

      - name: Commit synchronized play.html
        run: |
          if git diff --quiet -- play.html; then
            echo "play.html already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add play.html
          git commit -m "release: sync standalone play.html for V0.3"
          git push origin HEAD:${{ github.head_ref }}

      - name: Upload standalone
        uses: actions/upload-artifact@v4
        with:
          name: z501-play-html
          path: play.html
