name: Z502 release verification

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  release-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout head branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install tools
        run: |
          npm install --global typescript@latest esbuild@latest
          npm install --no-save playwright@latest
          npx playwright install --with-deps chromium

      - name: Full test and build
        run: |
          npm test
          npm run build

      - name: Bundle standalone
        run: |
          esbuild dist/main.js --bundle --format=iife --platform=browser --target=es2020 --outfile=standalone.js
          node <<'NODE'
          const fs = require('fs');
          let html = fs.readFileSync('index.html','utf8');
          const css = fs.readFileSync('src/styles.css','utf8');
          const js = fs.readFileSync('standalone.js','utf8');
          html = html
            .replace('<title>First Playable Fight</title>','<title>Juego Pelea V0.4</title>')
            .replace('<link rel="stylesheet" href="./styles.css" />','<style>\n'+css+'\n</style>')
            .replace('<script type="module" src="./main.js"></script>','<script>\n'+js+'\n</script>');
          if (html.includes('src="./main.js"') || html.includes('href="./styles.css"')) throw new Error('external runtime refs remain');
          fs.writeFileSync('play.html', html);
          NODE

      - name: Desktop and mobile release smoke
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');
          const path = require('path');
          const { pathToFileURL } = require('url');

          async function enterFight(page) {
            await page.goto(pathToFileURL(path.resolve('play.html')).href);
            await page.waitForSelector('.select-screen');
            await page.locator('[data-fighter]').first().click();
            await page.waitForSelector('[data-back]');
            await page.locator('[data-fighter]').last().click();
            await page.waitForSelector('.vs-screen');
            await page.waitForSelector('.fight-shell');
          }

          (async () => {
            const browser = await chromium.launch({headless:true});
            for (const c of [
              {name:'desktop', width:1280, height:720},
              {name:'mobile-landscape', width:852, height:393},
            ]) {
              const page = await browser.newPage({viewport:{width:c.width,height:c.height}});
              const errors=[];
              page.on('pageerror',e=>errors.push(e.message));
              page.on('console',m=>{ if(m.type()==='error') errors.push(m.text()); });
              await enterFight(page);

              if (await page.locator('canvas').count() < 1) throw new Error(c.name+': canvas missing');
              const ultimate = page.locator('[data-ultimate-button]');
              if (await ultimate.count() !== 1) throw new Error(c.name+': dedicated Ultimate missing');
              if (!(await ultimate.isDisabled())) throw new Error(c.name+': Ultimate should be disabled before READY');
              if (await page.locator('[data-action]').count() !== 4) throw new Error(c.name+': expected ATTACK/SPECIAL/JUMP/ULTIMATE');

              if (c.name === 'mobile-landscape') {
                const dpad = page.locator('[data-dpad]');
                const db = await dpad.boundingBox();
                const ub = await ultimate.boundingBox();
                if (!db || !ub) throw new Error('mobile: control bounds missing');
                if (ub.y < c.height/2 - 20) throw new Error('mobile: Ultimate obstructs upper playfield');
                if (ub.width < 54 || ub.height < 54) throw new Error('mobile: Ultimate target too small');

                await page.mouse.move(db.x+db.width*.82, db.y+db.height*.5);
                await page.mouse.down();
                await page.waitForTimeout(100);
                await page.mouse.up();
              }

              await page.waitForTimeout(500);
              if(errors.length) throw new Error(c.name+': runtime errors: '+errors.join(' | '));
              console.log(c.name+' smoke PASS');
              await page.close();
            }
            await browser.close();
          })().catch(e=>{ console.error(e); process.exit(1); });
          NODE

      - name: Browser touch input harness
        run: |
          node <<'NODE'
          const fs = require('fs');
          fs.writeFileSync('touch-harness.html', `<!doctype html><html><body>
          <div id="root">
            <div data-dpad style="width:160px;height:160px"></div>
            <button data-action="ultimate">ULTIMATE</button>
            <button data-action="jump">JUMP</button>
            <button data-action="special">SPECIAL</button>
            <button data-action="attack">ATTACK</button>
          </div>
          <script type="module">
            import { GameInput } from './dist/game/input/GameInput.js';
            const input = new GameInput(document.querySelector('#root'));
            window.__input = input;
          </script></body></html>`);
          NODE
          python3 -m http.server 4173 >/tmp/z502-http.log 2>&1 &
          SERVER_PID=$!
          trap "kill $SERVER_PID" EXIT
          node <<'NODE'
          const { chromium } = require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:852,height:393}});
            await page.goto('http://127.0.0.1:4173/touch-harness.html');
            await page.evaluate(() => { Element.prototype.setPointerCapture = function() {}; Element.prototype.releasePointerCapture = function() {}; });
            await page.waitForFunction(()=>window.__input);
            const d=page.locator('[data-dpad]'), u=page.locator('[data-action="ultimate"]');
            const db=await d.boundingBox(), ub=await u.boundingBox();
            await d.dispatchEvent('pointerdown',{pointerId:1,pointerType:'touch',clientX:db.x+db.width*.9,clientY:db.y+db.height*.5,isPrimary:true});
            await u.dispatchEvent('pointerdown',{pointerId:2,pointerType:'touch',clientX:ub.x+ub.width*.5,clientY:ub.y+ub.height*.5,isPrimary:false});
            const frame=await page.evaluate(()=>window.__input.getFrame({superReady:true,defensiveContext:false,nowMs:1000}));
            if(!frame.right) throw new Error('held movement missing during Ultimate touch');
            if(!frame.ultimate) throw new Error('Ultimate READY touch did not emit ultimate');
            if(frame.attack||frame.special||frame.pushGuard) throw new Error('Ultimate touch leaked another combat intent');
            const second=await page.evaluate(()=>window.__input.getFrame({superReady:true,defensiveContext:false,nowMs:1016}));
            if(second.ultimate) throw new Error('Ultimate repeated while held');
            await browser.close();
            console.log('touch movement + Ultimate READY harness PASS');
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE

      - name: Commit synchronized play.html
        run: |
          if git diff --quiet -- play.html; then
            echo "play.html already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add play.html
          git commit -m "release: sync standalone play.html for V0.4"
          git push origin HEAD:${{ github.head_ref }}
