    <script type="module">
// --- game/types.js ---
const EMPTY_INPUT = {
    left: false,
    right: false,
    down: false,
    up: false,
    jump: false,
    attack: false,
    special: false,
    dashLeft: false,
    dashRight: false,
};

// --- game/data/fighters.js ---
const FIGHTERS = {
    chameleon: {
        id: 'chameleon',
        displayName: 'Camaleón',
        role: 'Control de distancia',
        maxHealth: 1000,
        walkSpeed: 4.25,
        jumpSpeed: 12.4,
        gravity: 0.72,
        width: 54,
        height: 118,
        accent: '#7abf43',
    },
    supernariz: {
        id: 'supernariz',
        displayName: 'Supernariz',
        role: 'Rushdown / combos',
        maxHealth: 1000,
        walkSpeed: 4.8,
        jumpSpeed: 12.1,
        gravity: 0.74,
        width: 56,
        height: 122,
        accent: '#2f6bd7',
    },
};
const FIGHTER_IDS = Object.keys(FIGHTERS);

// --- game/input/dpad.js ---
const NEUTRAL_DIRECTION = { left: false, right: false, up: false, down: false };
function directionFromPoint(dx, dy, radius, deadZone) {
    const distance = Math.hypot(dx, dy);
    if (distance < deadZone || radius <= 0)
        return { ...NEUTRAL_DIRECTION };
    const angle = Math.atan2(dy, dx);
    const eighth = Math.PI / 8;
    const right = angle >= -eighth && angle < eighth;
    const downRight = angle >= eighth && angle < 3 * eighth;
    const down = angle >= 3 * eighth && angle < 5 * eighth;
    const downLeft = angle >= 5 * eighth && angle < 7 * eighth;
    const left = angle >= 7 * eighth || angle < -7 * eighth;
    const upLeft = angle >= -7 * eighth && angle < -5 * eighth;
    const up = angle >= -5 * eighth && angle < -3 * eighth;
    const upRight = angle >= -3 * eighth && angle < -eighth;
    return {
        left: left || downLeft || upLeft,
        right: right || downRight || upRight,
        up: up || upLeft || upRight,
        down: down || downLeft || downRight,
    };
}
function composeInputFrame(direction = {}, actions = {}) {
    return {
        ...EMPTY_INPUT,
        ...direction,
        ...actions,
    };
}

// --- game/input/doubleTap.js ---
class DoubleTapTracker {
    windowMs;
    lastDirection = null;
    lastTime = Number.NEGATIVE_INFINITY;
    constructor(windowMs = 230) {
        this.windowMs = windowMs;
    }
    tap(direction, nowMs) {
        const isDouble = direction === this.lastDirection && nowMs - this.lastTime <= this.windowMs;
        this.lastDirection = direction;
        this.lastTime = nowMs;
        if (isDouble) {
            this.lastDirection = null;
            this.lastTime = Number.NEGATIVE_INFINITY;
        }
        return isDouble;
    }
    reset() {
        this.lastDirection = null;
        this.lastTime = Number.NEGATIVE_INFINITY;
    }
}

// --- game/input/keyboard.js ---
function inputFromKeyboard(keys) {
    const left = keys.has('KeyA') || keys.has('ArrowLeft');
    const right = keys.has('KeyD') || keys.has('ArrowRight');
    const down = keys.has('KeyS') || keys.has('ArrowDown');
    const up = keys.has('KeyW') || keys.has('ArrowUp');
    return composeInputFrame({ left, right, down, up }, {
        jump: up || keys.has('Space'),
        attack: keys.has('KeyJ'),
        special: keys.has('KeyK'),
    });
}

// --- game/input/GameInput.js ---
const NEUTRAL = { left: false, right: false, up: false, down: false };
class GameInput {
    root;
    keys = new Set();
    touchDirection = { ...NEUTRAL };
    touchActions = { attack: false, special: false, jump: false };
    dpadPointer = null;
    cleanupCallbacks = [];
    doubleTap = new DoubleTapTracker(230);
    dashLeft = false;
    dashRight = false;
    constructor(root) {
        this.root = root;
        this.bindKeyboard();
        this.bindTouchControls();
    }
    getFrame() {
        const keyboard = inputFromKeyboard(this.keys);
        const touch = composeInputFrame(this.touchDirection, this.touchActions);
        const frame = {
            left: keyboard.left || touch.left,
            right: keyboard.right || touch.right,
            down: keyboard.down || touch.down,
            up: keyboard.up || touch.up,
            jump: keyboard.jump || touch.jump,
            attack: keyboard.attack || touch.attack,

const THREAT_MOVES = new Set([
    'claw1', 'claw2', 'tongueStraight', 'tongueLow',
    'nose1', 'nose2', 'nose3', 'tramontana',

    return selfX > otherX ? { left: true, right: false } : { left: false, right: true };

    return selfX > otherX ? { left: false, right: true } : { left: true, right: false };

        const otherIndex = this.cpuIndex === 0 ? 1 : 0;
        const foe = snapshot.fighters[otherIndex];
        if (self.health <= 0 || self.stunFrames > 0 || self.blockstunFrames > 0 || self.guardBreakFrames > 0)
            return out;
        const distance = Math.abs(foe.x - self.x);
        const threatRange = foe.id === 'chameleon' && foe.moveId?.startsWith('tongue') ? 360 : 185;
        const reactionFrame = foe.moveId?.startsWith('tongue') ? 7 : 8;
        const foeThreatening = foe.moveId !== null
            && THREAT_MOVES.has(foe.moveId)
            && foe.moveFrame >= reactionFrame
            && foe.moveFrame <= 14
            && distance < threatRange;
        const recognizesThreat = foeThreatening && ((snapshot.frame + this.cpuIndex * 3) % 5 !== 0);
        if (recognizesThreat) {
            this.intent = 'guard';
            this.intentUntil = snapshot.frame + 12;
            Object.assign(out, away(self.x, foe.x));
            if (foe.moveId === 'tongueLow')
                out.down = true;
            return out;
        }
        if (self.moveId !== null) {
            // Follow-up taps are attempted only in authored cancel windows. The simulation
            // itself now rejects whiff-cancels, so the CPU cannot mash a full combo on air.
            if (self.id === 'supernariz' && (self.moveId === 'nose1' || self.moveId === 'nose2') && self.moveFrame === 11) {
                out.attack = true;
            }
            if (self.id === 'chameleon' && self.moveId === 'claw1' && self.moveFrame === 11)
                out.attack = true;
            return out;
        }
        if (!self.grounded) {
            if (distance < 115 && snapshot.frame % 18 === 0)
                out.attack = true;
            return out;
        }

            if (this.intent === 'approach')
                Object.assign(out, toward(self.x, foe.x));
            if (this.intent === 'retreat' || this.intent === 'guard')
                Object.assign(out, away(self.x, foe.x));
            return out;
        }
        this.intent = 'neutral';
        // Low guard encourages space-making instead of perfect passive defense.
        if (self.guard < 30 && distance < 150 && snapshot.frame % 3 === this.cpuIndex) {
            Object.assign(out, dashAway(self.x, foe.x));
            this.intentUntil = snapshot.frame + 18;
            return out;
        }
        if (self.id === 'supernariz') {
            if (distance > 360 && self.projectileCooldown <= 0 && snapshot.frame > 0 && snapshot.frame % 120 === 0) {
                out.special = true;
                this.intentUntil = snapshot.frame + 24;
                return out;
            }
            if (distance >= 135 && distance <= 235 && snapshot.frame % 150 === 0) {
                out.down = true;
                out.special = true;
                this.intentUntil = snapshot.frame + 25;
                return out;
            }
            if (distance < 118) {
                out.attack = true;
                this.intentUntil = snapshot.frame + 18;
                return out;
            }
            this.intent = 'approach';
            this.intentUntil = snapshot.frame + 14;
            Object.assign(out, toward(self.x, foe.x));
            return out;
        }
        if (distance >= 150 && distance <= 355 && snapshot.frame % 72 === 0) {
            out.special = true;
            this.intentUntil = snapshot.frame + 22;
            return out;
        }
        if (distance < 88) {
            out.attack = true;
            this.intentUntil = snapshot.frame + 18;
            return out;
        }
        if (distance < 135) {
            this.intent = 'retreat';
            this.intentUntil = snapshot.frame + 14;
            Object.assign(out, away(self.x, foe.x));
            return out;
        }

        return { phase: 'vs', player: state.player, cpu: fighter, winner: null };

          ${this.hudFighter(1, this.flow.cpu)}
        </div>
        <button class="fight-controls-button" data-controls-button type="button" aria-label="Ver controles">?</button>
        ${this.hasShownCombatHint ? '' : '<div class="combat-hint" data-combat-hint><strong>Atrás = retroceder / bloquear</strong><span>Doble atrás = BACKDASH · Bloquear consume GUARD</span></div>'}
        <div class="touch-layer" data-touch-controls>
          <div class="dpad" data-dpad aria-label="D-pad de 8 direcciones">
            <span class="dpad-cross dpad-cross--h"></span><span class="dpad-cross dpad-cross--v"></span><span class="dpad-center"></span>
          </div>
          <div class="action-cluster">
            <button class="action-button action-button--jump" data-action="jump" type="button"><span>JUMP</span></button>
            <button class="action-button action-button--special" data-action="special" type="button"><span>SPECIAL</span></button>
            <button class="action-button action-button--attack" data-action="attack" type="button"><span>ATTACK</span></button>
          </div>
        </div>
        <div class="desktop-hint">A/D mover · S agachar · W/Space salto · J ataque · K especial</div>
      </main>
      ${this.controlsPanel()}
      ${this.orientationPrompt()}
    `;
        this.bindControlsPanel(true);
        if (!this.hasShownCombatHint) {
            this.hasShownCombatHint = true;
            clearTimeout(this.hintTimer);
            this.hintTimer = window.setTimeout(() => this.root.querySelector('[data-combat-hint]')?.classList.add('is-hidden'), 4200);
        }
        const canvas = this.root.querySelector('[data-fight-canvas]');
        const touchRoot = this.root.querySelector('[data-touch-controls]');
        if (!canvas || !touchRoot)
            throw new Error('Fight UI failed to mount');
        const simulation = new CombatSimulation(this.flow.player, this.flow.cpu);
        const renderer = new FightRenderer(canvas);
        const cpu = new CpuController(1);
        const playerCpu = this.autoplayPlayer ? new CpuController(0) : null;
        this.input = new GameInput(touchRoot);
        let previous = performance.now();
        let accumulator = 0;
        let snapshot = simulation.getSnapshot();
        renderer.consumeEvents(snapshot);
        const frame = (now) => {
            const elapsed = Math.min(100, now - previous);
            previous = now;
            if (!this.paused) {
                accumulator += elapsed;
                while (accumulator >= FIXED_MS) {
                    const humanInput = playerCpu ? playerCpu.nextInput(snapshot) : this.input?.getFrame() ?? { left: false, right: false, down: false, up: false, jump: false, attack: false, special: false, dashLeft: false, dashRight: false };
                    const cpuInput = cpu.nextInput(snapshot);
                    snapshot = simulation.step(humanInput, cpuInput);
                    renderer.consumeEvents(snapshot);
                    accumulator -= FIXED_MS;
                    this.updateHud(snapshot);
                }
            }
            else {
                accumulator = 0;
            }
            renderer.render(snapshot, now / 1000);
            if (snapshot.phase === 'match-over' && snapshot.winner !== null) {
                if (!this.matchFinished) {
                    this.matchFinished = true;
                    const winner = snapshot.winner;
                    window.setTimeout(() => this.showResult(winner), 650);
                }
                return;
            }
            this.raf = requestAnimationFrame(frame);
        };
        this.raf = requestAnimationFrame(frame);
    }
    hudFighter(index, id) {
        return `
      <section class="hud-fighter hud-fighter--${index === 0 ? 'left' : 'right'}">
        <div class="hud-meta"><strong>${FIGHTERS[id].displayName}</strong><span>${index === 0 ? 'P1' : 'CPU'}</span></div>
        <div class="health-track"><span class="health-fill" data-health="${index}"></span></div>
        <div class="guard-row"><span class="guard-label">GUARD</span><div class="guard-track" data-guard-track="${index}"><span class="guard-fill" data-guard="${index}"></span></div></div>
        <div class="round-pips"><i data-win="${index}-0"></i><i data-win="${index}-1"></i></div>
      </section>
    `;
    }
    updateHud(snapshot) {
        for (const index of [0, 1]) {
            const fighter = snapshot.fighters[index];
            const health = this.root.querySelector(`[data-health="${index}"]`);
            if (health)
                health.style.transform = `scaleX(${Math.max(0, fighter.health / fighter.maxHealth)})`;
            const guard = this.root.querySelector(`[data-guard="${index}"]`);
            if (guard)
                guard.style.transform = `scaleX(${Math.max(0, fighter.guard / fighter.maxGuard)})`;
            this.root.querySelector(`[data-guard-track="${index}"]`)?.classList.toggle('is-broken', fighter.guardBreakFrames > 0);
            for (let pip = 0; pip < 2; pip += 1) {
                this.root.querySelector(`[data-win="${index}-${pip}"]`)?.classList.toggle('is-won', pip < fighter.roundWins);
            }
        }
        const timer = this.root.querySelector('[data-timer]');
        if (timer)
            timer.textContent = String(Math.ceil(snapshot.roundTimerFrames / 60));
        const round = this.root.querySelector('[data-round]');
        if (round)
            round.textContent = `R${snapshot.round}`;
        const shell = this.root.querySelector('[data-game-phase]');
        if (shell)
            shell.dataset.gamePhase = snapshot.phase;
    }
    showResult(winner) {
        if (this.flow.phase !== 'fight' || !this.flow.player || !this.flow.cpu)
            return;
        const playerId = this.flow.player;
        const cpuId = this.flow.cpu;
        this.cleanupFight();
        this.flow = finishFight(this.flow, winner);
        const playerWon = winner === 0;
        const winnerId = playerWon ? playerId : cpuId;
        this.root.innerHTML = `
      <main class="result-screen fighter-card--${winnerId}">
        <span class="result-kicker">RESULTADO</span>
        <h1>${playerWon ? 'VICTORIA' : 'DERROTA'}</h1>
        <p><strong>${FIGHTERS[winnerId].displayName}</strong> gana el duelo.</p>
        <div class="result-actions">
          <button class="primary-button" data-rematch>REVANCHA</button>
          <button class="secondary-button" data-select>SELECCIÓN</button>
        </div>
      </main>
      ${this.orientationPrompt()}
    `;
        this.root.querySelector('[data-rematch]')?.addEventListener('click', () => {
            this.flow = rematch(this.flow);
            this.showVs(500);
        });
        this.root.querySelector('[data-select]')?.addEventListener('click', () => {
            this.flow = backToSelect(this.flow);
            this.autoplayPlayer = false;
            this.showCharacterSelect();
        });
    }
    cleanupFight() {
        if (this.raf)
            cancelAnimationFrame(this.raf);
        this.raf = 0;
        clearTimeout(this.vsTimer);
        this.input?.destroy();
        this.input = null;
        this.paused = false;
        clearTimeout(this.hintTimer);
        this.hintTimer = 0;
    }
    bindControlsPanel(pausesFight) {
        const panel = this.root.querySelector('[data-controls-panel]');
        const open = () => {
            panel?.classList.add('is-open');
            panel?.setAttribute('aria-hidden', 'false');
            if (pausesFight)
                this.paused = true;
        };
        const close = () => {
            panel?.classList.remove('is-open');
            panel?.setAttribute('aria-hidden', 'true');
            if (pausesFight)
                this.paused = false;
        };
        for (const button of this.root.querySelectorAll('[data-controls-button]'))
            button.addEventListener('click', open);
        this.root.querySelector('[data-controls-close]')?.addEventListener('click', close);
    }
    controlsPanel() {
        return `
      <aside class="controls-panel" data-controls-panel aria-hidden="true">
        <div class="controls-card">
          <div class="controls-heading"><span>GUÍA RÁPIDA</span><strong>CONTROLES</strong><button data-controls-close type="button" aria-label="Cerrar controles">×</button></div>
          <div class="controls-grid">
            <section><h3>MOVIMIENTO</h3><p><b>D-pad</b><span>Moverse</span></p><p><b>Atrás</b><span>Retroceder / bloquear</span></p><p><b>Abajo + atrás</b><span>Bloqueo bajo</span></p><p><b>Doble adelante</b><span>Dash</span></p><p><b>Doble atrás</b><span>Backdash / esquiva</span></p></section>
            <section><h3>ACCIONES</h3><p><b>JUMP</b><span>Saltar</span></p><p><b>ATTACK</b><span>Ataque</span></p><p><b>SPECIAL</b><span>Especial</span></p></section>
          </div>
          <div class="controls-tips"><strong>COMBATE</strong><span>Bloquear consume GUARD · Saltar evita lows y algunos proyectiles · Fallar ataques deja recovery · Backdash esquiva strikes durante una ventana corta</span></div>
        </div>
      </aside>
    `;
    }
    orientationPrompt() {
        return '<aside class="orientation-prompt"><div class="phone-icon">↻</div><strong>GIRÁ EL TELÉFONO</strong><span>Este prototipo se juega en horizontal.</span></aside>';
    }
}

// --- main.js ---
const app = document.querySelector('#app');
if (!app)
    throw new Error('Missing #app');
new AppController(app).start();
</script>
  </body>
</html>
