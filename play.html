<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
    <meta name="theme-color" content="#0c1018" />
    <title>Juego Pelea V0.4</title>
    <style>
:root {
  font-family: "Arial Narrow", "Roboto Condensed", Impact, system-ui, sans-serif;
  color: #f7f0df;
  background: #07090e;
  font-synthesis: none;
  --ink: #080a10;
  --cream: #f7f0df;
  --gold: #d8a84d;
  --red: #c94537;
  --green: #67a54d;
  --blue: #286ab6;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body, #app { width: 100%; height: 100%; margin: 0; overflow: hidden; }
body { touch-action: none; overscroll-behavior: none; user-select: none; background: var(--ink); }
button { font: inherit; color: inherit; }

.select-screen, .vs-screen, .result-screen, .fight-shell { position: relative; width: 100%; height: 100%; overflow: hidden; }
.select-screen { display: grid; grid-template-rows: auto 1fr auto; padding: max(18px, env(safe-area-inset-top)) max(30px, env(safe-area-inset-right)) max(16px, env(safe-area-inset-bottom)) max(30px, env(safe-area-inset-left)); background: radial-gradient(circle at 50% 25%, #273046 0, #121620 42%, #080a0e 100%); }
.select-backdrop { position:absolute; inset:0; opacity:.22; background: repeating-linear-gradient(115deg, transparent 0 45px, rgba(255,255,255,.025) 45px 47px), linear-gradient(90deg, rgba(66,127,70,.25), transparent 42%, transparent 58%, rgba(48,94,157,.25)); pointer-events:none; }
.select-header { position:relative; z-index:1; text-align:center; }
.game-badge, .fighter-kicker, .result-kicker, .vs-label { font-size: clamp(9px, 1.2vw, 13px); letter-spacing:.22em; font-weight:900; color:#d6ae65; }
.select-header h1 { margin:5px 0 2px; font-family: Impact, Haettenschweiler, sans-serif; font-size:clamp(30px, 6vw, 68px); letter-spacing:.04em; line-height:.95; text-shadow:0 4px 18px #000; }
.select-header p { margin:6px 0; color:#b9bdc7; font:600 clamp(11px,1.4vw,15px) system-ui,sans-serif; }
.fighter-grid { position:relative; z-index:1; width:min(930px,92vw); margin:auto; display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:clamp(14px,3vw,38px); align-items:center; }
.fighter-card { min-width:0; position:relative; display:grid; grid-template-rows:auto 1fr auto auto auto auto; min-height:min(57vh,430px); padding:16px 18px 14px; border:1px solid rgba(255,255,255,.18); border-radius:8px; background:linear-gradient(160deg, rgba(255,255,255,.08), rgba(0,0,0,.34)); box-shadow:0 18px 55px rgba(0,0,0,.45), inset 0 0 0 1px rgba(255,255,255,.03); text-align:left; cursor:pointer; overflow:hidden; transition:transform .16s ease, border-color .16s ease, filter .16s ease; }
.fighter-card::after { content:""; position:absolute; inset:auto 0 0; height:4px; background:var(--accent); }
.fighter-card--chameleon { --accent:#75b958; --accent-dark:#1d5427; }
.fighter-card--supernariz { --accent:#3b85dc; --accent-dark:#153c78; }
.fighter-card:hover, .fighter-card:focus-visible { transform:translateY(-4px); border-color:color-mix(in srgb, var(--accent) 70%, white); outline:none; filter:brightness(1.08); }
.fighter-card.is-player { box-shadow:0 0 0 2px var(--accent),0 18px 55px rgba(0,0,0,.45); }
.fighter-portrait { position:relative; align-self:stretch; min-height:145px; margin:8px -4px 4px; display:grid; place-items:center; overflow:hidden; isolation:isolate; }
.fighter-portrait::before { content:""; position:absolute; width:62%; aspect-ratio:1; border-radius:50%; background:radial-gradient(circle at 35% 30%, color-mix(in srgb,var(--accent) 72%,white), var(--accent-dark) 68%, transparent 70%); filter:drop-shadow(0 14px 15px rgba(0,0,0,.5)); transform:skewX(-7deg); }
.fighter-portrait--chameleon::after { content:""; position:absolute; width:42%; height:42%; border:9px solid #67994c; border-left-color:transparent; border-radius:50%; right:5%; bottom:12%; transform:rotate(20deg); opacity:.9; }
.fighter-portrait--supernariz::after { content:""; position:absolute; width:40%; height:14%; border-radius:60% 90% 90% 60%; background:#d4a184; left:49%; top:44%; transform:rotate(-8deg); box-shadow:0 4px 7px rgba(0,0,0,.4); }
.portrait-mark { z-index:2; font:900 clamp(55px,10vw,118px)/1 Impact,sans-serif; color:rgba(5,9,8,.72); text-shadow:0 2px 0 rgba(255,255,255,.1); }
.fighter-name { font:900 clamp(23px,3.7vw,44px)/.95 Impact,sans-serif; letter-spacing:.035em; text-transform:uppercase; }
.fighter-role { margin-top:4px; color:var(--accent); font:900 clamp(11px,1.4vw,15px) system-ui,sans-serif; text-transform:uppercase; letter-spacing:.12em; }
.fighter-moves { margin:7px 0 10px; color:#bfc3cb; font:600 clamp(9px,1.2vw,13px)/1.25 system-ui,sans-serif; }
.fighter-pick { justify-self:end; padding:6px 10px; border:1px solid rgba(255,255,255,.17); border-radius:3px; font-size:10px; letter-spacing:.13em; font-weight:900; }
.select-footer { position:relative; z-index:1; display:flex; justify-content:space-between; align-items:center; min-height:24px; color:#7f8590; font:600 10px system-ui,sans-serif; letter-spacing:.08em; text-transform:uppercase; }
.text-button { border:0; background:transparent; color:#c9cbd0; cursor:pointer; padding:6px 0; }

.vs-screen { display:grid; grid-template-columns:1fr auto 1fr; align-items:center; background:linear-gradient(100deg,#162316,#0b0c11 46% 54%,#111c31); }
.vs-side { height:100%; display:flex; flex-direction:column; justify-content:center; gap:7px; padding:8vw; background:radial-gradient(circle at center,var(--accent-dark),transparent 60%); }
.vs-side--right { text-align:right; align-items:flex-end; }
.vs-side strong { font:900 clamp(38px,8vw,100px)/.88 Impact,sans-serif; text-transform:uppercase; text-shadow:0 8px 25px #000; }
.vs-side span:not(.vs-label) { color:#b5b7bf; font:800 14px system-ui,sans-serif; text-transform:uppercase; letter-spacing:.18em; }
.vs-mark { z-index:2; font:900 clamp(48px,8vw,100px) Impact,sans-serif; font-style:italic; color:#efe1bc; text-shadow:0 0 35px rgba(230,172,73,.4); transform:rotate(-5deg); }

.fight-shell { background:#06080c; }
.fight-canvas { display:block; width:100%; height:100%; }
.hud { position:absolute; z-index:10; top:max(8px,env(safe-area-inset-top)); left:max(14px,env(safe-area-inset-left)); right:max(14px,env(safe-area-inset-right)); height:64px; display:grid; grid-template-columns:minmax(0,1fr) 82px minmax(0,1fr); gap:10px; pointer-events:none; filter:drop-shadow(0 3px 6px rgba(0,0,0,.8)); }
.hud-fighter { position:relative; min-width:0; }
.hud-fighter--right { text-align:right; }
.hud-meta { display:flex; justify-content:space-between; align-items:end; margin-bottom:4px; text-transform:uppercase; }
.hud-fighter--right .hud-meta { flex-direction:row-reverse; }
.hud-meta strong { font:900 clamp(12px,2vw,22px)/1 Impact,sans-serif; letter-spacing:.05em; }
.hud-meta span { color:#d7b86f; font:800 9px system-ui,sans-serif; letter-spacing:.13em; }
.health-track { height:16px; padding:2px; border:2px solid rgba(242,232,202,.82); background:#151319; transform:skewX(-8deg); overflow:hidden; }
.health-fill { display:block; width:100%; height:100%; background:linear-gradient(90deg,#d65937,#edc253 65%,#ece29f); transform-origin:left; transition:transform 80ms linear; }
.hud-fighter--right .health-fill { transform-origin:right; }
.round-pips { display:flex; gap:4px; margin-top:4px; }
.hud-fighter--right .round-pips { justify-content:flex-end; }
.round-pips i { width:9px; height:9px; border:1px solid #af8d55; border-radius:50%; background:#27252a; }
.round-pips i.is-won { background:#e5b44e; box-shadow:0 0 8px #e5b44e; }
.hud-center { display:flex; flex-direction:column; align-items:center; }
.round-label { color:#b6a075; font:800 9px system-ui,sans-serif; letter-spacing:.18em; }
.timer { font:900 clamp(29px,4vw,45px)/.9 Impact,sans-serif; }

.touch-layer { position:absolute; z-index:20; inset:0; pointer-events:none; }
.dpad { position:absolute; pointer-events:auto; left:max(18px,env(safe-area-inset-left)); bottom:max(15px,env(safe-area-inset-bottom)); width:clamp(116px,18vw,172px); aspect-ratio:1; border-radius:50%; background:radial-gradient(circle,rgba(255,255,255,.11),rgba(0,0,0,.28) 70%); border:1px solid rgba(255,255,255,.13); opacity:.78; touch-action:none; }
.dpad-cross { position:absolute; inset:50% auto auto 50%; border-radius:9px; background:rgba(18,20,27,.62); border:1px solid rgba(255,255,255,.16); transform:translate(-50%,-50%); }
.dpad-cross--h { width:86%; height:32%; }
.dpad-cross--v { width:32%; height:86%; }
.dpad-center { position:absolute; width:25%; aspect-ratio:1; left:50%; top:50%; transform:translate(-50%,-50%); border-radius:50%; background:#343742; box-shadow:inset 0 0 0 2px rgba(255,255,255,.09); }
.dpad[data-direction]:not([data-direction=""]) { filter:brightness(1.3); }
.action-cluster { position:absolute; pointer-events:none; right:max(16px,env(safe-area-inset-right)); bottom:max(15px,env(safe-area-inset-bottom)); width:clamp(230px,33vw,330px); height:clamp(134px,21vw,200px); }
.action-button { position:absolute; pointer-events:auto; border-radius:50%; border:2px solid rgba(255,255,255,.42); background:linear-gradient(145deg,rgba(255,255,255,.22),rgba(8,9,13,.72)); box-shadow:0 5px 12px rgba(0,0,0,.38),inset 0 0 16px rgba(255,255,255,.06); display:grid; place-items:center; font:900 clamp(9px,1.2vw,13px) system-ui,sans-serif; letter-spacing:.04em; text-shadow:0 2px 4px #000; touch-action:none; }
.action-button span { pointer-events:none; }
.action-button--attack { width:clamp(70px,10vw,96px); aspect-ratio:1; right:0; bottom:0; border-color:rgba(226,153,70,.7); }
.action-button--special { width:clamp(64px,9vw,88px); aspect-ratio:1; right:34%; bottom:34%; border-color:rgba(97,164,218,.72); }
.action-button--jump { width:clamp(58px,8vw,78px); aspect-ratio:1; right:3%; top:0; border-color:rgba(212,212,220,.65); }
.action-button--ultimate { width:clamp(62px,8.8vw,86px); aspect-ratio:1; left:0; bottom:0; border-color:rgba(228,190,82,.48); color:rgba(241,225,181,.72); font-size:clamp(7px,1vw,10px); letter-spacing:.02em; }
.action-button--ultimate:disabled { opacity:.34; filter:saturate(.55); box-shadow:0 4px 10px rgba(0,0,0,.28),inset 0 0 12px rgba(255,255,255,.035); }
.action-button--ultimate.is-ready { opacity:1; border-color:rgba(255,220,112,.95); color:#fff0b4; background:radial-gradient(circle at 38% 32%,rgba(255,229,141,.34),rgba(122,80,20,.74) 62%,rgba(8,9,13,.78)); box-shadow:0 0 18px rgba(255,204,84,.55),0 5px 12px rgba(0,0,0,.38),inset 0 0 18px rgba(255,244,181,.14); animation:ultimate-ready-pulse 1.15s ease-in-out infinite; }
@keyframes ultimate-ready-pulse { 50% { filter:brightness(1.18); box-shadow:0 0 24px rgba(255,211,104,.72),0 5px 12px rgba(0,0,0,.38),inset 0 0 18px rgba(255,244,181,.18); } }
.action-button.is-pressed { transform:scale(.92); filter:brightness(1.45); }
.desktop-hint { position:absolute; left:50%; bottom:max(8px,env(safe-area-inset-bottom)); transform:translateX(-50%); z-index:12; color:rgba(255,255,255,.38); font:600 9px system-ui,sans-serif; pointer-events:none; }

.result-screen { display:grid; place-content:center; text-align:center; gap:8px; background:radial-gradient(circle at 50% 35%,var(--accent-dark),#090a0e 58%); }
.result-screen h1 { margin:0; font:900 clamp(64px,14vw,150px)/.85 Impact,sans-serif; letter-spacing:.03em; text-shadow:0 8px 28px #000; }
.result-screen p { margin:4px 0 18px; color:#bfc1c7; font:600 16px system-ui,sans-serif; }
.result-actions { display:flex; justify-content:center; gap:10px; }
.primary-button,.secondary-button { min-width:150px; padding:13px 20px; border-radius:3px; border:1px solid rgba(255,255,255,.24); font:900 13px system-ui,sans-serif; letter-spacing:.12em; cursor:pointer; }
.primary-button { background:#d0a34e; color:#17120a; }
.secondary-button { background:rgba(255,255,255,.07); }

.orientation-prompt { display:none; position:fixed; z-index:999; inset:0; background:#090b10; place-content:center; justify-items:center; text-align:center; gap:10px; padding:30px; }
.phone-icon { font-size:50px; }
.orientation-prompt strong { font:900 27px Impact,sans-serif; letter-spacing:.08em; }
.orientation-prompt span { color:#a7aab2; font:600 14px system-ui,sans-serif; }

@media (orientation: portrait) and (max-width: 900px) { .orientation-prompt { display:grid; } }
@media (hover:hover) and (pointer:fine) { .touch-layer { opacity:.28; } }
@media (max-height: 520px) {
  .select-screen { padding-top:10px; padding-bottom:8px; }
  .select-header p { display:none; }
  .fighter-card { min-height:70vh; padding:10px 14px 9px; }
  .fighter-portrait { min-height:105px; margin:2px; }
  .fighter-moves { margin:3px 0 6px; }
  .select-footer { min-height:16px; }
  .hud { height:50px; top:5px; }
  .health-track { height:13px; }
  .desktop-hint { display:none; }
}
@media (max-width: 720px) and (orientation: landscape) {
  .fighter-grid { width:95vw; gap:12px; }
  .fighter-card { padding:9px 11px 8px; }
  .fighter-portrait { min-height:92px; }
  .fighter-pick { display:none; }
  .fighter-moves { font-size:8px; }
}

/* V0.2 combat fundamentals */
.guard-row { display:flex; align-items:center; gap:6px; margin-top:4px; }
.hud-fighter--right .guard-row { flex-direction:row-reverse; }
.guard-label { flex:0 0 auto; color:#a9abb2; font:800 7px system-ui,sans-serif; letter-spacing:.16em; }
.guard-track { position:relative; flex:1; height:6px; border:1px solid rgba(219,225,235,.48); background:rgba(10,12,17,.82); overflow:hidden; transform:skewX(-8deg); }
.guard-fill { display:block; width:100%; height:100%; background:linear-gradient(90deg,#7b9fd3,#d0e5ff); transform-origin:left; transition:transform 90ms linear, filter 120ms ease; }
.hud-fighter--right .guard-fill { transform-origin:right; }
.guard-track.is-broken { overflow:visible; border-color:#e76e55; box-shadow:0 0 12px rgba(231,110,85,.8); animation:guard-break-pulse .22s steps(2,end) infinite; }
.guard-track.is-broken .guard-fill { filter:brightness(.55); }
.guard-track.is-broken::after { content:'GUARD BREAK'; position:absolute; top:8px; left:50%; transform:translateX(-50%) skewX(8deg); white-space:nowrap; color:#ffb09d; font:900 8px system-ui,sans-serif; letter-spacing:.1em; text-shadow:0 2px 5px #000; }
@keyframes guard-break-pulse { 50% { opacity:.62; } }

.controls-link { border-bottom:1px solid rgba(216,168,77,.35); color:#d6ae65; }
.fight-controls-button { position:absolute; z-index:31; top:max(78px,calc(env(safe-area-inset-top) + 72px)); right:max(14px,env(safe-area-inset-right)); width:30px; height:30px; border-radius:50%; border:1px solid rgba(255,255,255,.32); background:rgba(9,11,16,.62); color:#e7d8b6; font:900 15px system-ui,sans-serif; cursor:pointer; backdrop-filter:blur(4px); }
.fight-controls-button:active { transform:scale(.94); }

.controls-panel { display:none; position:fixed; z-index:1000; inset:0; place-items:center; padding:max(18px,env(safe-area-inset-top)) max(18px,env(safe-area-inset-right)) max(18px,env(safe-area-inset-bottom)) max(18px,env(safe-area-inset-left)); background:rgba(4,5,8,.82); backdrop-filter:blur(8px); }
.controls-panel.is-open { display:grid; }
.controls-card { width:min(720px,92vw); max-height:88vh; overflow:auto; padding:20px; border:1px solid rgba(255,255,255,.18); border-radius:8px; background:linear-gradient(155deg,#181d29,#0b0e14 68%); box-shadow:0 28px 80px rgba(0,0,0,.65); }
.controls-heading { display:grid; grid-template-columns:1fr auto; align-items:center; border-bottom:1px solid rgba(255,255,255,.11); padding-bottom:12px; margin-bottom:15px; }
.controls-heading span { grid-column:1; color:#b89a61; font:800 9px system-ui,sans-serif; letter-spacing:.18em; }
.controls-heading strong { grid-column:1; font:900 clamp(28px,5vw,46px)/.9 Impact,sans-serif; letter-spacing:.05em; }
.controls-heading button { grid-column:2; grid-row:1 / span 2; width:36px; height:36px; border-radius:50%; border:1px solid rgba(255,255,255,.22); background:rgba(255,255,255,.06); cursor:pointer; font-size:24px; }
.controls-grid { display:grid; grid-template-columns:1.35fr 1fr; gap:20px; }
.controls-grid h3 { margin:0 0 9px; color:#d8a84d; font:900 10px system-ui,sans-serif; letter-spacing:.16em; }
.controls-grid p { display:grid; grid-template-columns:minmax(110px,.85fr) 1.3fr; gap:10px; margin:0; padding:7px 0; border-bottom:1px solid rgba(255,255,255,.07); font:700 11px system-ui,sans-serif; }
.controls-grid p b { color:#f2e7cc; }
.controls-grid p span { color:#aeb3be; font-weight:600; }
.controls-tips { margin-top:16px; padding:11px 12px; border-left:3px solid #d8a84d; background:rgba(216,168,77,.08); display:grid; gap:4px; font:600 10px/1.45 system-ui,sans-serif; color:#bfc3cb; }
.controls-tips strong { color:#e3bd72; letter-spacing:.14em; }

.combat-hint { position:absolute; z-index:24; left:50%; bottom:26px; transform:translateX(-50%); display:grid; gap:2px; min-width:min(440px,66vw); padding:9px 16px; border:1px solid rgba(255,255,255,.15); border-radius:4px; background:rgba(8,10,15,.72); backdrop-filter:blur(5px); text-align:center; pointer-events:none; animation:hint-in .28s ease-out both; transition:opacity .45s ease, transform .45s ease; }
.combat-hint strong { color:#f0e5cc; font:900 11px system-ui,sans-serif; letter-spacing:.07em; }
.combat-hint span { color:#aeb3be; font:700 9px system-ui,sans-serif; letter-spacing:.04em; }
.combat-hint.is-hidden { opacity:0; transform:translate(-50%,10px); }
@keyframes hint-in { from { opacity:0; transform:translate(-50%,10px); } }

@media (max-height:520px) {
  .guard-row { margin-top:2px; }
  .guard-track { height:5px; }
  .fight-controls-button { top:58px; width:27px; height:27px; }
  .combat-hint { bottom:8px; padding:6px 10px; min-width:min(390px,58vw); }
  .controls-card { max-height:94vh; padding:14px; }
  .controls-grid { gap:14px; }
  .controls-grid p { padding:4px 0; font-size:9px; }
  .controls-tips { margin-top:10px; padding:7px 9px; }
}

@media (max-width:720px) and (orientation:landscape) {
  .controls-card { width:94vw; }
  .controls-grid { grid-template-columns:1fr 1fr; }
  .controls-heading strong { font-size:28px; }
  .combat-hint { max-width:58vw; }
}

@media (prefers-reduced-motion:reduce) {
  .combat-hint, .guard-track.is-broken { animation:none; }
}


/* V0.3 HUD surfaces — presentation only; values come from simulation snapshots. */
.super-row { display:flex; align-items:center; gap:6px; margin-top:3px; min-width:0; }
.hud-fighter--right .super-row { flex-direction:row-reverse; }
.super-label { flex:0 0 auto; color:#d9b866; font:900 7px system-ui,sans-serif; letter-spacing:.15em; }
.super-track { position:relative; flex:1; height:7px; border:1px solid rgba(235,196,103,.62); background:rgba(10,12,17,.84); overflow:hidden; transform:skewX(-8deg); }
.super-fill { display:block; width:100%; height:100%; background:linear-gradient(90deg,#8f6831,#e7bb57,#fff0a4); transform-origin:left; transition:transform 90ms linear, filter 140ms ease; }
.hud-fighter--right .super-fill { transform-origin:right; }
.super-track.is-ready { overflow:visible; border-color:#ffe08a; box-shadow:0 0 10px rgba(255,213,105,.58); }
.super-track.is-ready .super-fill { filter:brightness(1.28); }
.super-track.is-ready::after { content:'READY'; position:absolute; top:50%; left:50%; transform:translate(-50%,-50%) skewX(8deg); color:#171108; font:900 6px system-ui,sans-serif; letter-spacing:.12em; text-shadow:0 1px 0 rgba(255,255,255,.28); }

.special-cooldown { position:absolute; right:0; top:100%; margin-top:3px; display:flex; align-items:center; gap:4px; color:rgba(224,231,241,.68); font:800 6px system-ui,sans-serif; letter-spacing:.11em; }
.hud-fighter--right .special-cooldown { right:auto; left:0; flex-direction:row-reverse; }
.special-cooldown-track { width:42px; height:3px; background:rgba(255,255,255,.12); overflow:hidden; }
.special-cooldown-fill { display:block; width:100%; height:100%; background:rgba(115,181,229,.78); transform-origin:left; transition:transform 90ms linear, filter 120ms ease; }
.special-cooldown.is-ready { color:rgba(205,235,255,.9); }
.special-cooldown.is-ready .special-cooldown-fill { filter:brightness(1.35); }
.hud-fighter--right .special-cooldown-fill { transform-origin:right; }

.super-hint { position:absolute; z-index:25; left:50%; top:max(76px,calc(env(safe-area-inset-top) + 70px)); transform:translateX(-50%); display:grid; gap:2px; padding:7px 12px; border:1px solid rgba(255,218,124,.45); border-radius:3px; background:rgba(13,12,10,.76); color:#f4d98f; font:900 9px system-ui,sans-serif; letter-spacing:.08em; text-align:center; pointer-events:none; backdrop-filter:blur(4px); animation:super-hint-in .22s ease-out both; transition:opacity .35s ease, transform .35s ease; }
.super-hint strong { font:900 9px system-ui,sans-serif; }
.super-hint span { font:800 7px system-ui,sans-serif; letter-spacing:.12em; }
.super-hint.is-hidden { opacity:0; transform:translate(-50%,-7px); }
@keyframes super-hint-in { from { opacity:0; transform:translate(-50%,-7px); } }

@media (max-height:520px) {
  .super-row { margin-top:2px; }
  .super-track { height:5px; }

  function chooseFighter(state, fighter) {
    if (state.phase === "select-player")
      return { phase: "select-cpu", player: fighter, cpu: null, winner: null };
    if (state.phase === "select-cpu" && state.player)
      return { phase: "vs", player: state.player, cpu: fighter, winner: null };
    return state;
  }
  function startFight(state) {
    if (state.phase !== "vs" || !state.player || !state.cpu)
      return state;
    return { ...state, phase: "fight", winner: null };
  }
  function finishFight(state, winner) {
    if (state.phase !== "fight")
      return state;
    return { ...state, phase: "result", winner };
  }
  function rematch(state) {
    if (state.phase !== "result" || !state.player || !state.cpu)
      return state;
    return { ...state, phase: "vs", winner: null };
  }
  function backToSelect(_state) {
    return initialFlowState();
  }

  // dist/game/ui/AppController.js
  var FIXED_MS = 1e3 / 60;
  var FIGHTER_ORDER = ["chameleon", "supernariz"];
  var fighterCopy = {
    chameleon: {
      kicker: "CONTROL DE DISTANCIA",
      role: "Zoner",
      moves: "Lengua recta \xB7 Lengua baja \xB7 Garras",
      mark: "C"
    },
    supernariz: {
      kicker: "PRESI\xD3N Y COMBOS",
      role: "Rushdown",
      moves: "Combo de nariz \xB7 Chorizo \xB7 Tramontana",
      mark: "N"
    }
  };
  var AppController = class {
    constructor(root) {
      __publicField(this, "root");
      __publicField(this, "flow", initialFlowState());
      __publicField(this, "raf", 0);
      __publicField(this, "vsTimer", 0);
      __publicField(this, "input", null);
      __publicField(this, "matchFinished", false);
      __publicField(this, "autoplayPlayer", false);
      __publicField(this, "paused", false);
      __publicField(this, "hasShownCombatHint", false);
      __publicField(this, "hintTimer", 0);
      __publicField(this, "hasShownSuperReadyHint", false);
      __publicField(this, "superHintTimer", 0);
      this.root = root;
    }
    start() {
      const params = new URLSearchParams(location.search);
      if (params.get("demo") === "1") {
        this.flow = { phase: "vs", player: "chameleon", cpu: "supernariz", winner: null };
        this.autoplayPlayer = true;
        this.showVs(250);
        return;
      }
      this.showCharacterSelect();
    }
    showCharacterSelect() {
      this.cleanupFight();
      const selectingCpu = this.flow.phase === "select-cpu";
      const title = selectingCpu ? "ELEG\xCD AL RIVAL" : "ELEG\xCD TU LUCHADOR";
      const subtitle = selectingCpu ? `Vas con ${this.flow.player ? FIGHTERS[this.flow.player].displayName : ""}. Ahora eleg\xED la CPU.` : "Dos estilos opuestos. El mismo lenguaje de controles.";
      this.root.innerHTML = `
      <main class="select-screen">
        <div class="select-backdrop"></div>
        <header class="select-header">
          <span class="game-badge">FIRST PLAYABLE \xB7 V0.4</span>
          <h1>${title}</h1>
          <p>${subtitle}</p>
        </header>
        <section class="fighter-grid" aria-label="Selecci\xF3n de luchador">
          ${FIGHTER_ORDER.map((id) => this.fighterCard(id, selectingCpu)).join("")}
        </section>
        <footer class="select-footer">
          ${selectingCpu ? '<button class="text-button" data-back>\u2190 Cambiar mi luchador</button>' : "<span>Touch: D-pad + Ataque + Especial + Salto + ULTIMATE</span>"}
          <button class="text-button controls-link" data-controls-button type="button">? CONTROLES</button>
          <span>Atr\xE1s: retroceder / bloquear</span>
        </footer>
      </main>
      ${this.controlsPanel()}
      ${this.orientationPrompt()}
    `;
      for (const button of this.root.querySelectorAll("[data-fighter]")) {
        button.addEventListener("click", () => {
          const id = button.dataset.fighter;
          this.flow = chooseFighter(this.flow, id);
          if (this.flow.phase === "select-cpu")
            this.showCharacterSelect();
          else if (this.flow.phase === "vs")
            this.showVs();
        });
      }
      this.root.querySelector("[data-back]")?.addEventListener("click", () => {
        this.flow = backToSelect(this.flow);
        this.showCharacterSelect();
      });
      this.bindControlsPanel(false);
    }
    fighterCard(id, cpuSelection) {
      const info = fighterCopy[id];
      const selected = this.flow.player === id;
      return `
      <button class="fighter-card fighter-card--${id}${selected ? " is-player" : ""}" data-fighter="${id}" type="button">
        <span class="fighter-kicker">${info.kicker}</span>
        <span class="fighter-portrait fighter-portrait--${id}" aria-hidden="true">
          <span class="portrait-mark">${info.mark}</span>
          <span class="portrait-detail"></span>
        </span>
        <span class="fighter-name">${FIGHTERS[id].displayName}</span>
        <span class="fighter-role">${info.role}</span>
        <span class="fighter-moves">${info.moves}</span>
        <span class="fighter-pick">${cpuSelection ? "ELEGIR COMO RIVAL" : "ELEGIR"}</span>
      </button>
    `;
    }
    showVs(delay = 900) {
      if (!this.flow.player || !this.flow.cpu)
        return;
      const p1 = this.flow.player;
      const p2 = this.flow.cpu;
      this.root.innerHTML = `
      <main class="vs-screen">
        <div class="vs-side vs-side--left fighter-card--${p1}">
          <span class="vs-label">JUGADOR</span><strong>${FIGHTERS[p1].displayName}</strong><span>${fighterCopy[p1].role}</span>
        </div>
        <div class="vs-mark">VS</div>
        <div class="vs-side vs-side--right fighter-card--${p2}">
          <span class="vs-label">CPU</span><strong>${FIGHTERS[p2].displayName}</strong><span>${fighterCopy[p2].role}</span>
        </div>
      </main>
      ${this.orientationPrompt()}
    `;
      clearTimeout(this.vsTimer);
      this.vsTimer = window.setTimeout(() => {
        this.flow = startFight(this.flow);
        this.mountFight();
      }, delay);
    }
    mountFight() {
      if (this.flow.phase !== "fight" || !this.flow.player || !this.flow.cpu)
        return;
      this.matchFinished = false;
      this.hasShownSuperReadyHint = false;
      this.root.innerHTML = `
      <main class="fight-shell" data-game-phase="fight">
        <canvas class="fight-canvas" data-fight-canvas aria-label="Arena de combate"></canvas>
        <div class="hud" aria-live="polite">
          ${this.hudFighter(0, this.flow.player)}
          <div class="hud-center"><span class="round-label" data-round>R1</span><strong class="timer" data-timer>60</strong></div>
          ${this.hudFighter(1, this.flow.cpu)}
        </div>
        <button class="fight-controls-button" data-controls-button type="button" aria-label="Ver controles">?</button>
        ${this.hasShownCombatHint ? "" : '<div class="combat-hint" data-combat-hint><strong>Atr\xE1s = retroceder / bloquear</strong><span>Doble atr\xE1s = BACKDASH \xB7 Bloquear consume GUARD</span></div>'}
        <div class="super-hint is-hidden" data-super-hint><strong>SUPER READY</strong><span>TOC\xC1 ULTIMATE \xB7 teclado J+K</span></div>
        <div class="touch-layer" data-touch-controls>
          <div class="dpad" data-dpad aria-label="D-pad de 8 direcciones">
            <span class="dpad-cross dpad-cross--h"></span><span class="dpad-cross dpad-cross--v"></span><span class="dpad-center"></span>
          </div>
          <div class="action-cluster">
            <button class="action-button action-button--ultimate" data-action="ultimate" data-ultimate-button type="button" aria-label="Ultimate: requiere SUPER READY" disabled><span>ULTIMATE</span></button>
            <button class="action-button action-button--jump" data-action="jump" type="button"><span>JUMP</span></button>
            <button class="action-button action-button--special" data-action="special" type="button"><span>SPECIAL</span></button>
            <button class="action-button action-button--attack" data-action="attack" type="button"><span>ATTACK</span></button>
          </div>
        </div>
        <div class="desktop-hint">A/D mover \xB7 S agachar \xB7 W/Space salto \xB7 J ataque \xB7 K especial \xB7 J+K ultimate con SUPER READY</div>
      </main>
      ${this.controlsPanel()}
      ${this.orientationPrompt()}
    `;
      this.bindControlsPanel(true);
      if (!this.hasShownCombatHint) {
        this.hasShownCombatHint = true;
        clearTimeout(this.hintTimer);
        this.hintTimer = window.setTimeout(() => this.root.querySelector("[data-combat-hint]")?.classList.add("is-hidden"), 4200);
      }
      const canvas = this.root.querySelector("[data-fight-canvas]");
      const touchRoot = this.root.querySelector("[data-touch-controls]");
      if (!canvas || !touchRoot)
        throw new Error("Fight UI failed to mount");
      const simulation = new CombatSimulation(this.flow.player, this.flow.cpu);
      const renderer = new FightRenderer(canvas);
      const cpu = new CpuController(1);
      const playerCpu = this.autoplayPlayer ? new CpuController(0) : null;
      this.input = new GameInput(touchRoot);
      let previous = performance.now();
      let accumulator = 0;
      let snapshot = simulation.getSnapshot();
      renderer.consumeEvents(snapshot);
      const frame = (now) => {
        const elapsed = Math.min(100, now - previous);
        previous = now;
        if (!this.paused) {
          accumulator += elapsed;
          while (accumulator >= FIXED_MS) {
            const playerState = snapshot.fighters[0];
            const humanInput = playerCpu ? playerCpu.nextInput(snapshot) : this.input?.getFrame({
              superReady: playerState.superReady,
              defensiveContext: playerState.blocking || playerState.blockstunFrames > 0,
              nowMs: now
            }) ?? EMPTY_INPUT;
            const cpuInput = cpu.nextInput(snapshot);
            snapshot = simulation.step(humanInput, cpuInput);
            renderer.consumeEvents(snapshot);
            accumulator -= FIXED_MS;
            this.updateHud(snapshot);
          }
        } else {
          accumulator = 0;
        }
        renderer.render(snapshot, now / 1e3);
        if (snapshot.phase === "match-over" && snapshot.winner !== null) {
          if (!this.matchFinished) {
            this.matchFinished = true;
            const winner = snapshot.winner;
            window.setTimeout(() => this.showResult(winner), 650);
          }
          return;
        }
        this.raf = requestAnimationFrame(frame);
      };
      this.raf = requestAnimationFrame(frame);
    }
    hudFighter(index, id) {
      return `
      <section class="hud-fighter hud-fighter--${index === 0 ? "left" : "right"}">
        <div class="hud-meta"><strong>${FIGHTERS[id].displayName}</strong><span>${index === 0 ? "P1" : "CPU"}</span></div>
        <div class="health-track"><span class="health-fill" data-health="${index}"></span></div>
        <div class="guard-row"><span class="guard-label">GUARD</span><div class="guard-track" data-guard-track="${index}"><span class="guard-fill" data-guard="${index}"></span></div></div>
        <div class="super-row"><span class="super-label">SUPER</span><div class="super-track" data-super-track="${index}"><span class="super-fill" data-super="${index}"></span></div></div>
        ${id === "supernariz" ? `<div class="special-cooldown" data-special-cooldown="${index}"><span>CHORIZO</span><span class="special-cooldown-track"><i class="special-cooldown-fill" data-special-cooldown-fill="${index}"></i></span></div>` : ""}
        <div class="round-pips"><i data-win="${index}-0"></i><i data-win="${index}-1"></i></div>
      </section>
    `;
    }
    updateHud(snapshot) {
      for (const index of [0, 1]) {
        const fighter = snapshot.fighters[index];
        const health = this.root.querySelector(`[data-health="${index}"]`);
        if (health)
          health.style.transform = `scaleX(${Math.max(0, fighter.health / fighter.maxHealth)})`;
        const guard = this.root.querySelector(`[data-guard="${index}"]`);
        if (guard)
          guard.style.transform = `scaleX(${Math.max(0, fighter.guard / fighter.maxGuard)})`;
        this.root.querySelector(`[data-guard-track="${index}"]`)?.classList.toggle("is-broken", fighter.guardBreakFrames > 0);
        const superFill = this.root.querySelector(`[data-super="${index}"]`);
        if (superFill)
          superFill.style.transform = `scaleX(${Math.max(0, Math.min(1, fighter.superMeter / Math.max(1, fighter.maxSuper)))})`;
        this.root.querySelector(`[data-super-track="${index}"]`)?.classList.toggle("is-ready", fighter.superReady);
        const cooldownFill = this.root.querySelector(`[data-special-cooldown-fill="${index}"]`);
        if (cooldownFill) {
          const cooldownReady = fighter.projectileCooldownMax <= 0 ? 1 : Math.max(0, Math.min(1, 1 - fighter.projectileCooldown / fighter.projectileCooldownMax));
          cooldownFill.style.transform = `scaleX(${cooldownReady})`;
        }
        this.root.querySelector(`[data-special-cooldown="${index}"]`)?.classList.toggle("is-ready", fighter.projectileCooldown <= 0);
        for (let pip = 0; pip < 2; pip += 1) {
          this.root.querySelector(`[data-win="${index}-${pip}"]`)?.classList.toggle("is-won", pip < fighter.roundWins);
        }
      }
      const ultimateButton = this.root.querySelector("[data-ultimate-button]");
      if (ultimateButton) {
        ultimateButton.disabled = !snapshot.fighters[0].superReady;
        ultimateButton.classList.toggle("is-ready", snapshot.fighters[0].superReady);
        ultimateButton.setAttribute("aria-label", snapshot.fighters[0].superReady ? "Ultimate READY" : "Ultimate: requiere SUPER READY");
      }
      if (!this.hasShownSuperReadyHint && snapshot.fighters[0].superReady) {
        this.hasShownSuperReadyHint = true;
        const hint = this.root.querySelector("[data-super-hint]");
        hint?.classList.remove("is-hidden");
        clearTimeout(this.superHintTimer);
        this.superHintTimer = window.setTimeout(() => hint?.classList.add("is-hidden"), 2600);
      }
      const timer = this.root.querySelector("[data-timer]");
      if (timer)
        timer.textContent = String(Math.ceil(snapshot.roundTimerFrames / 60));
      const round = this.root.querySelector("[data-round]");
      if (round)
        round.textContent = `R${snapshot.round}`;
      const shell = this.root.querySelector("[data-game-phase]");
      if (shell)
        shell.dataset.gamePhase = snapshot.phase;
    }
    showResult(winner) {
      if (this.flow.phase !== "fight" || !this.flow.player || !this.flow.cpu)
        return;
      const playerId = this.flow.player;
      const cpuId = this.flow.cpu;
      this.cleanupFight();
      this.flow = finishFight(this.flow, winner);
      const playerWon = winner === 0;
      const winnerId = playerWon ? playerId : cpuId;
      this.root.innerHTML = `
      <main class="result-screen fighter-card--${winnerId}">
        <span class="result-kicker">RESULTADO</span>
        <h1>${playerWon ? "VICTORIA" : "DERROTA"}</h1>
        <p><strong>${FIGHTERS[winnerId].displayName}</strong> gana el duelo.</p>
        <div class="result-actions">
          <button class="primary-button" data-rematch>REVANCHA</button>
          <button class="secondary-button" data-select>SELECCI\xD3N</button>
        </div>
      </main>
      ${this.orientationPrompt()}
    `;
      this.root.querySelector("[data-rematch]")?.addEventListener("click", () => {
        this.flow = rematch(this.flow);
        this.showVs(500);
      });
      this.root.querySelector("[data-select]")?.addEventListener("click", () => {
        this.flow = backToSelect(this.flow);
        this.autoplayPlayer = false;
        this.showCharacterSelect();
      });
    }
    cleanupFight() {
      if (this.raf)
        cancelAnimationFrame(this.raf);
      this.raf = 0;
      clearTimeout(this.vsTimer);
      this.input?.destroy();
      this.input = null;
      this.paused = false;
      clearTimeout(this.hintTimer);
      this.hintTimer = 0;
      clearTimeout(this.superHintTimer);
      this.superHintTimer = 0;
    }
    bindControlsPanel(pausesFight) {
      const panel = this.root.querySelector("[data-controls-panel]");
      const open = () => {
        panel?.classList.add("is-open");
        panel?.setAttribute("aria-hidden", "false");
        if (pausesFight)
          this.paused = true;
      };
      const close = () => {
        panel?.classList.remove("is-open");
        panel?.setAttribute("aria-hidden", "true");
        if (pausesFight)
          this.paused = false;
      };
      for (const button of this.root.querySelectorAll("[data-controls-button]"))
        button.addEventListener("click", open);
      this.root.querySelector("[data-controls-close]")?.addEventListener("click", close);
    }
    controlsPanel() {
      return `
      <aside class="controls-panel" data-controls-panel aria-hidden="true">
        <div class="controls-card">
          <div class="controls-heading"><span>GU\xCDA R\xC1PIDA</span><strong>CONTROLES</strong><button data-controls-close type="button" aria-label="Cerrar controles">\xD7</button></div>
          <div class="controls-grid">
            <section><h3>MOVIMIENTO</h3><p><b>D-pad</b><span>Moverse</span></p><p><b>Atr\xE1s</b><span>Retroceder / bloquear</span></p><p><b>Abajo + atr\xE1s</b><span>Bloqueo bajo</span></p><p><b>Doble adelante</b><span>Dash</span></p><p><b>Doble atr\xE1s</b><span>Backdash / esquiva</span></p></section>
            <section><h3>ACCIONES</h3><p><b>JUMP</b><span>Saltar</span></p><p><b>ATTACK</b><span>Ataque</span></p><p><b>SPECIAL</b><span>Especial contextual</span></p><p><b>SPECIAL bloqueando</b><span>Push Guard: pide separaci\xF3n usando GUARD</span></p><p><b>ULTIMATE (Touch)</b><span>Ultimate cuando SUPER est\xE1 READY</span></p><p><b>J + K (teclado)</b><span>Fallback de Ultimate en desktop cuando SUPER est\xE1 READY</span></p></section>
          </div>
          <div class="controls-tips"><strong>COMBATE</strong><span>Bloquear consume GUARD \xB7 Dash y Backdash comprometen movimiento \xB7 Saltar evita lows y algunos proyectiles \xB7 Push Guard solo se intenta mientras bloque\xE1s \xB7 Touch: ULTIMATE \xB7 Teclado: J+K</span></div>
        </div>
      </aside>
    `;
    }
    orientationPrompt() {
      return '<aside class="orientation-prompt"><div class="phone-icon">\u21BB</div><strong>GIR\xC1 EL TEL\xC9FONO</strong><span>Este prototipo se juega en horizontal.</span></aside>';
    }
  };

  // dist/main.js
  var app = document.querySelector("#app");
  if (!app)
    throw new Error("Missing #app");
  new AppController(app).start();
})();
