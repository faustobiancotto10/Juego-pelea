<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>V07-SPR-G1 Runtime Sprite Assets</title>
<style>
html,body{margin:0;background:#0e1520;color:#eef3fb;font-family:system-ui,sans-serif}
main{width:1280px;height:720px;position:relative;overflow:hidden;background:linear-gradient(#111a27,#182334)}
h1{position:absolute;left:32px;top:18px;margin:0;font-size:28px;letter-spacing:.04em;z-index:2}
p{position:absolute;left:34px;top:58px;margin:0;color:#aeb8c8;font-weight:650;z-index:2}
canvas{position:absolute;inset:0;width:1280px;height:720px}
</style>
</head>
<body>
<main>
<h1>EL TORO — SERVED SPRITE ASSETS</h1>
<p>Exact runtime manifest + atlas · authored RIGHT + LEFT · no procedural fighter rig</p>
<canvas id="c" width="1280" height="720"></canvas>
</main>
<script>
(async()=>{
  const canvas=document.querySelector('#c');
  const ctx=canvas.getContext('2d');
  ctx.fillStyle='#eef3fb';
  ctx.textAlign='center';
  ctx.font='800 20px system-ui';

  try {
    const manifest=await fetch('/assets/fighters/el-toro/el-toro-animations.json').then(r=>{
      if(!r.ok) throw new Error('manifest HTTP '+r.status);
      return r.json();
    });
    const image=new Image();
    image.src='/assets/fighters/el-toro/'+manifest.atlas;
    await image.decode();

    const poses=[
      {label:'RIGHT · IDLE',x:170,map:manifest.animations,key:'idle',frame:0},
      {label:'LEFT · IDLE',x:470,map:manifest.leftAnimations,key:'idle',frame:0},
      {label:'RIGHT · TOPETE',x:790,map:manifest.animations,key:'move:topete',frame:4},
      {label:'LEFT · ULTIMATE',x:1100,map:manifest.leftAnimations,key:'ultimate:superEructo:startup',frame:3},
    ];

    for(const pose of poses){
      const frames=pose.map[pose.key].frames;
      const fr=frames[Math.min(pose.frame,frames.length-1)];
      const scale=Math.min(1.55,260/fr.width,500/fr.height);
      const ground=640;
      ctx.save();
      ctx.translate(pose.x,ground);
      ctx.scale(scale,scale);
      ctx.drawImage(
        image,
        fr.x,fr.y,fr.width,fr.height,
        -fr.pivotX,-fr.pivotY,fr.width,fr.height
      );
      ctx.restore();
      ctx.fillText(pose.label,pose.x,690);
    }

    ctx.font='650 15px system-ui';
    ctx.fillStyle='#aeb8c8';
    ctx.fillText('mirrorSafe:false · '+Object.keys(manifest.animations).length+' RIGHT keys · '+Object.keys(manifest.leftAnimations).length+' LEFT keys',640,105);
    const receipt=document.createElement('div');
    receipt.textContent='READY · SPRITE BACKEND DRAWN';
    receipt.setAttribute('data-ready-canvas',canvas.toDataURL('image/png'));
    receipt.style.display='none';
    document.body.appendChild(receipt);
    window.__SPRITE_EVIDENCE_READY__=true;
  } catch(error) {
    ctx.fillStyle='#ff8080';
    ctx.textAlign='left';
    ctx.font='700 20px monospace';
    ctx.fillText('SPRITE EVIDENCE ERROR: '+String(error),32,150);
    document.body.dataset.error=String(error);
  }
})();
</script>
</body>
</html>
